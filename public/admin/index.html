<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Shop Admin</title>

    <link rel="stylesheet" href="./style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" />

    <link
        href="https://fonts.googleapis.com/css?family=Montserrat:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css?family=Montserrat+Alternates:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
        rel="stylesheet" />
</head>

<body>
    <section class="auth" id="auth-view">
        <div class="container">
            <h1>Вхід</h1>

            <form id="auth-form">
                <input name="username" placeholder="Логін" autocomplete="off">
                <input name="password" type="password" placeholder="Пароль" autocomplete="off">

                <button type="submit" id="submit-btn">Увійти</button>
            </form>

            <p id="message"></p>
        </div>
    </section>

    <div class="wrap" id="user-view" hidden>
        <header>
            <div class="profile">
                <div class="user">
                    <span>/</span>
                    <h3 id="username">Username</h3>
                    <i class="fa-regular fa-circle-check"></i>
                </div>

                <button id="logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>

            <h2><span>/</span>Creator Shop | Admin</h2>
        </header>

        <div class="tabsContainer">
            <button class="tabBtn active" data-page="productsPage">
                <i class="fa-solid fa-basket-shopping"></i>
                Products
            </button>
            <button class="tabBtn" data-page="ordersPage">
                <i class="fa-solid fa-receipt"></i>
                Orders
            </button>
        </div>

        <div class="pageContainer">
            <div class="page productsPage active">
                <div class="controlContainer">
                    <button id="createModalOpen" class="addBtn">
                        <i class="fa-solid fa-square-plus"></i>
                        Add New
                    </button>
                </div>

                <div class="tableContainer">
                    <table class="productsTable">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Price</th>
                                <th>Change</th>
                            </tr>
                        </thead>

                        <tbody id="productsList"></tbody>
                    </table>
                </div>
            </div>

            <div class="page ordersPage">
                <div class="tableContainer">
                    <table class="productsTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Adress</th>
                                <th>Goods</th>
                                <th>Bill</th>
                                <th>Status</th>
                                <th>Control</th>
                            </tr>
                        </thead>

                        <tbody id="ordersList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="blurLayer"></div>
    </div>

    <section class="productChangeModal" id="productModal">
        <div class="top">
            <h3><i class="fa-solid fa-file-circle-plus"></i> Create Product</h3>

            <button id="changeProductModalClose">X</button>
        </div>

        <form id="productForm">
            <div class="field">
                <label for="title">Product name:</label>
                <input type="text" name="title" id="title" required>
            </div>

            <div class="field">
                <label for="description">Description:</label>
                <textarea name="description" id="description" required></textarea>
            </div>

            <div class="field">
                <label for="price">Price: </label>
                <input type="number" name="price" id="price" required>
            </div>

            <div class="field">
                <label for="image">Image:</label>
                <input type="file" name="image" id="image" required>
            </div>

            <button type="submit" id="productChangeBtn"><i class="fa-solid fa-boxes-packing"></i> Create</button>
        </form>
    </section>

    <section class="deleteProductModal" id="deleteProductModal">
        <div class="top">
            <h3>Do you want to delete it?</h3>
        </div>

        <div class="control">
            <button id="deleteModalAccept">
                <i class="fa-solid fa-trash"></i>
                Delete
            </button>

            <button id="deleteModalCancel" class="cancelBtn">
                <i class="fa-solid fa-arrow-left"></i>
                Cancel
            </button>
        </div>
    </section>

    <section class="orderUpdateModal">
        <div class="top">
            <h3>Update order status</h3>

            <button id="orderUpdateClose">X</button>
        </div>

        <div class="form">
            <select id="orderUpdateSelect"></select>

            <button class="updateBtn" id="orederUpdateBtn">Update</button>
        </div>
    </section>

    <script src="./main.js"></script>
</body>

</html>
